<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopline · Maintenance Dashboard</title>
  <meta name="description" content="Live maintenance operations dashboard — work orders, preventive maintenance, parts and asset status. Runs as a demo right in the browser, or on your shop network with the Node server." />
  <meta http-equiv="refresh" content="0; url=./public/" />
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center;
      background: radial-gradient(1200px 700px at 20% -10%, #16223d 0%, #0b1120 55%, #090e1b 100%);
      color: #e7eefb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .splash { text-align: center; padding: 24px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 18px; filter: drop-shadow(0 6px 18px rgba(251, 191, 36, .25)); }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0 0 22px; color: #8ba1c2; font-size: 15px; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid #23324f; border-top-color: #fbbf24; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #fbbf24; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .noscript { color: #ef4444; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="splash">
    <svg class="mark" viewBox="0 0 48 48" role="img" aria-label="Shopline">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
        </linearGradient>
      </defs>
      <path d="M24 3.6 41.4 13.8v20.4L24 44.4 6.6 34.2V13.8z" fill="url(#g)"/>
      <path d="M24 8.4 37.2 16v16L24 39.6 10.8 32V16z" fill="#0b1220" opacity=".9"/>
      <circle cx="24" cy="24" r="8.2" fill="url(#g)"/>
      <circle cx="24" cy="24" r="3.1" fill="#0b1220"/>
      <g stroke="url(#g)" stroke-width="2.4" stroke-linecap="round">
        <path d="M24 13.2v2.6M24 32.2v2.6M13.2 24h2.6M32.2 24h2.6"/>
      </g>
    </svg>
    <h1>Shopline</h1>
    <p>Maintenance operations dashboard</p>
    <div class="spinner" aria-hidden="true"></div>
    <a href="./public/">Open the dashboard</a>
    <noscript><div class="noscript">JavaScript is disabled — use the link above.</div></noscript>
  </main>
  <script>location.replace('./public/');</script>
</body>
</html>
