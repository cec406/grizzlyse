<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIZZLY_SE // Cyber Range</title>
<meta name="description" content="Grizzly System Engineering training range: a beginner-friendly hacking game covering password cracking, network recon, log forensics, steganography and SQL injection.">
<style>
  :root{
    --bg:#0f172a;          /* Grizzly deep slate */
    --amber:#f4b942;       /* main terminal text */
    --amber-dim:#9a7530;   /* dim amber */
    --accent:#d97706;      /* Grizzly primary amber */
    --gold:#ffd166;        /* highlight gold */
    --red:#ff6b6b;
    --violet:#e0a3ff;
    --line:rgba(217,119,6,.30);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at center,#1a2338 0%,#0b1120 62%,#0f172a 100%);
    color:var(--amber);
    font-family:"SFMono-Regular","Menlo","Consolas","Courier New",ui-monospace,monospace;
    font-size:15px;
    line-height:1.45;
    overflow:hidden;
    text-shadow:0 0 6px rgba(244,185,66,.30);
  }
  #matrix{position:fixed;inset:0;z-index:0;opacity:.10;pointer-events:none}
  #crt{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}
  #crt::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0px,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;
  }
  #crt::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.85) 130%);
    animation:flicker 4.5s infinite;
  }
  @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.86}99%{opacity:.95}}

  header{
    display:flex;align-items:center;gap:16px;
    padding:10px 18px;border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    position:relative;z-index:3;
  }
  #logo{font-weight:bold;letter-spacing:3px;color:var(--accent);text-shadow:0 0 10px rgba(217,119,6,.65)}
  #logo span{color:var(--amber)}
  .hud{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px;color:var(--amber-dim)}
  .hud b{color:var(--gold);font-weight:bold;text-shadow:0 0 8px rgba(255,209,102,.5)}
  .btn{
    cursor:pointer;border:1px solid var(--line);background:rgba(217,119,6,.10);
    color:var(--amber);padding:4px 10px;border-radius:4px;font:inherit;font-size:12px;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:rgba(217,119,6,.22);border-color:var(--amber)}
  .btn.off{opacity:.45}

  #app{flex:1;display:flex;min-height:0;position:relative;z-index:3}
  #term{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 18px 10px}
  #output{
    flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
    scrollbar-width:thin;scrollbar-color:var(--amber-dim) transparent;
  }
  #output::-webkit-scrollbar{width:8px}
  #output::-webkit-scrollbar-thumb{background:var(--amber-dim);border-radius:4px}
  .line{animation:rise .12s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .ok{color:var(--amber)}
  .err{color:var(--red);text-shadow:0 0 6px rgba(255,107,107,.4)}
  .warn{color:var(--gold);text-shadow:0 0 6px rgba(255,209,102,.35)}
  .dim{color:var(--amber-dim);text-shadow:none}
  .accent{color:var(--accent);text-shadow:0 0 8px rgba(217,119,6,.45)}
  .violet{color:var(--violet);text-shadow:0 0 8px rgba(224,163,255,.4)}
  .head{color:var(--accent);font-weight:bold;letter-spacing:1px}
  .echo .cmdtext{color:var(--amber);text-shadow:0 0 8px rgba(244,185,66,.5)}
  .echo .ps1{color:var(--accent)}

  #inputrow{
    display:flex;gap:8px;align-items:center;margin-top:10px;
    border-top:1px solid var(--line);padding-top:10px;
  }
  #ps1{color:var(--accent);white-space:nowrap;font-weight:bold}
  #cmd{
    flex:1;background:transparent;border:0;outline:0;color:var(--amber);
    font:inherit;caret-color:var(--amber);text-shadow:inherit;
  }
  #cmd:disabled{opacity:.4}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #sidebar{
    width:290px;border-left:1px solid var(--line);padding:16px;
    overflow-y:auto;background:rgba(0,0,0,.35);
    scrollbar-width:thin;scrollbar-color:var(--amber-dim) transparent;
  }
  #sidebar h3{margin:0 0 10px;font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
  #missions{list-style:none;margin:0 0 22px;padding:0}
  #missions li{
    display:flex;gap:10px;align-items:flex-start;padding:7px 9px;margin-bottom:6px;
    border:1px solid transparent;border-radius:5px;font-size:13px;color:var(--amber-dim);
    transition:all .2s;
  }
  #missions li .badge{
    flex:none;width:20px;text-align:center;color:var(--amber-dim);
  }
  #missions li.active{border-color:var(--amber);color:var(--amber);background:rgba(217,119,6,.12)}
  #missions li.done{color:var(--amber);opacity:.85}
  #missions li.done .badge{color:var(--amber)}
  #missions li.locked{opacity:.4}
  #missions .mname{display:block;font-weight:bold;letter-spacing:.5px}
  #missions .mdesc{display:block;font-size:11px;color:var(--amber-dim)}
  .achv{display:inline-block;font-size:11px;padding:3px 7px;margin:3px 3px 0 0;border:1px solid var(--violet);border-radius:20px;color:var(--violet)}
  #stats{font-size:12px;color:var(--amber-dim);line-height:1.9}
  #stats b{color:var(--gold)}
  .sep{border:0;border-top:1px solid var(--line);margin:16px 0}

  .progressbar{color:var(--accent)}
  .flag{color:var(--violet);font-weight:bold;text-shadow:0 0 10px rgba(224,163,255,.6)}
  .ascii{color:var(--accent);text-shadow:0 0 10px rgba(217,119,6,.45);line-height:1.15}

  #toast{
    position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);z-index:60;
    background:rgba(0,0,0,.92);border:1px solid var(--violet);color:var(--violet);
    padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:all .35s;
    box-shadow:0 0 24px rgba(224,163,255,.4);font-size:13px;text-align:center;white-space:pre-line;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:860px){
    #app{flex-direction:column}
    #sidebar{
      width:100%;order:2;max-height:42vh;border-left:0;
      border-top:1px solid var(--line);background:rgba(0,0,0,.6);
    }
    .hide-sm{display:none}
    .hud{gap:10px;font-size:12px}
    body{font-size:14px}
    #term{padding:12px}
  }
  @media (prefers-reduced-motion: reduce){
    .line{animation:none}
    #crt::before{animation:none}
    #crt::after{display:none}
    #matrix{display:none}
  }
</style>
<link rel="stylesheet" href="../range/labshell.css">
</head>
<body>
<canvas id="matrix"></canvas>
<div id="crt">
  <header>
    <div id="logo">GRIZZLY<span>_SYSTEM_ENG</span></div>
    <div class="hud">
      <span>SCORE <b id="hud-score">0</b></span>
      <span class="hide-sm">MISSION <b id="hud-mission">0/5</b></span>
      <button class="btn" id="soundBtn" title="Toggle sound">SND: ON</button>
      <button class="btn" id="helpBtn" title="Show help">HELP</button>
    </div>
  </header>
  <div id="app">
    <div id="term">
      <div id="output" aria-live="polite"></div>
      <div id="inputrow">
        <span id="ps1">guest@grizzlyse:~$</span>
        <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type a command and press Enter... (try: help)" disabled>

      <h3>Objectives</h3>
      <ul id="missions"></ul>

      <div id="stats">
        SCORE <b id="stat-score">0</b><br>
        MISSIONS <b id="stat-missions">0 / 5</b><br>
        HINTS USED <b id="stat-hints">0</b><br>
        COMMANDS <b id="stat-cmds">0</b>
      </div>
      <hr class="sep">
      <button class="btn" id="resetBtn" style="width:100%">RESET PROGRESS</button>

    </aside>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
   GRIZZLY_SE // Cyber Range
   Grizzly System Engineering training simulator.
   A single-file, beginner-friendly hacking game. No dependencies.
   ========================================================================== */

/* ----------------------------- tiny DOM helpers --------------------------- */
const $ = (sel) => document.querySelector(sel);
const out = $("#output");

function makeEl(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

/* Print one line (or multi-line string). cls = optional CSS class. */
function print(text, cls){
  const e = makeEl("div", "line" + (cls ? " " + cls : ""), text);
  out.appendChild(e);
  scrollBottom();
  return e;
}

/* Print an array of strings or {text, cls} objects. */
function printLines(lines){
  if (!Array.isArray(lines)) { if (lines != null) print(String(lines)); return; }
  for (const ln of lines){
    if (ln && typeof ln === "object") print(ln.text, ln.cls);
    else print(String(ln));
  }
}

function scrollBottom(){ out.scrollTop = out.scrollHeight; }

/* Create a line we can update in place (for progress animations). */
function liveLine(cls){
  const e = print("", cls);
  return {
    set(t){ e.textContent = t; scrollBottom(); },
    el: e
  };
}

/* Typewriter effect for narrative. Resolves when done (or skipped). */
let skipTyping = false;
function typeText(text, cls, speed){
  speed = speed || 12;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced){
    const e = makeEl("div", "line" + (cls ? " " + cls : ""), text);
    out.appendChild(e); scrollBottom();
    return Promise.resolve();
  }
  return new Promise((resolve) => {
    const e = makeEl("div", "line" + (cls ? " " + cls : ""), "");
    out.appendChild(e);
    let i = 0;
    skipTyping = false;
    const timer = setInterval(() => {
      if (skipTyping){ e.textContent = text; clearInterval(timer); scrollBottom(); resolve(); return; }
      e.textContent = text.slice(0, ++i);
      if (i % 2 === 0) Audio.key();
      scrollBottom();
      if (i >= text.length){ clearInterval(timer); resolve(); }
    }, speed);
  });
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ------------------------------- audio ----------------------------------- */
const Audio = {
  ctx: null,
  enabled: true,
  init(){
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ this.ctx = null; }
  },
  tone(freq, dur, type, vol){
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try{
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol == null ? 0.05 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur);
    }catch(e){}
  },
  key(){ this.tone(1200 + Math.random()*300, 0.012, "square", 0.015); },
  ok(){ this.tone(880,0.08,"triangle",0.06); setTimeout(()=>this.tone(1320,0.12,"triangle",0.06),70); },
  err(){ this.tone(160,0.18,"sawtooth",0.06); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.18,"triangle",0.07), i*110)); },
  flag(){ [659,784,988,1318,1568].forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,"triangle",0.07), i*130)); },
  scan(){ this.tone(300 + Math.random()*500, 0.03, "square", 0.02); }
};

/* ------------------------------ matrix rain ------------------------------- */
(function matrix(){
  const c = $("#matrix"); const ctx = c.getContext("2d");
  let cols, drops, fs = 16;
  const chars = "01ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃ".split("");
  function resize(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    cols = Math.floor(c.width / fs);
    drops = new Array(cols).fill(0).map(()=>Math.random()*c.height/fs);
  }
  resize(); window.addEventListener("resize", resize);
  function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.06)"; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = "#d97706"; ctx.font = fs + "px monospace";
    for (let i=0;i<cols;i++){
      const t = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(t, i*fs, drops[i]*fs);
      if (drops[i]*fs > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();

/* ------------------------------- tokenizer -------------------------------- */
function tokenize(str){
  const tokens = []; let cur = ""; let q = null;
  for (const ch of str){
    if (q){ if (ch === q) q = null; else cur += ch; }
    else if (ch === '"' || ch === "'"){ q = ch; }
    else if (ch === " " || ch === "\t"){ if (cur !== ""){ tokens.push(cur); cur = ""; } }
    else cur += ch;
  }
  if (cur !== "") tokens.push(cur);
  return tokens;
}

/* ============================================================================
   GAME
   ========================================================================== */
const Game = {
  state: {
    mission: 0,
    score: 0,
    hints: 0,
    commands: 0,
    completed: {},
    achievements: {},
    started: false
  },
  history: [],
  histIdx: -1,
  current: null,

  /* ---- persistence ---- */
  save(){
    try{ localStorage.setItem("grizzlyse.save", JSON.stringify(this.state)); }catch(e){}
  },
  load(){
    try{
      const raw = localStorage.getItem("grizzlyse.save");
      if (raw) this.state = Object.assign(this.state, JSON.parse(raw));
    }catch(e){}
  },
  hardReset(){
    try{ localStorage.removeItem("grizzlyse.save"); }catch(e){}
    location.reload();
  },

  /* ---- scoring ---- */
  addScore(n){ this.state.score += n; this.syncHUD(); },
  award(name){
    if (this.state.achievements[name]) return false;
    this.state.achievements[name] = true;
    this.toast("ACHIEVEMENT UNLOCKED\n" + name);
    Audio.flag();
    this.syncHUD(); this.save();
    return true;
  },
  toast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>t.classList.remove("show"), 3200);
  },
  syncHUD(){
    $("#hud-score").textContent = this.state.score;
    const done = Object.keys(this.state.completed).length;
    $("#hud-mission").textContent = done + "/" + MISSIONS.length;
    $("#stat-score").textContent = this.state.score;
    $("#stat-missions").textContent = done + " / " + MISSIONS.length;
    $("#stat-hints").textContent = this.state.hints;
    $("#stat-cmds").textContent = this.state.commands;
    // sidebar missions
    const ul = $("#missions"); ul.innerHTML = "";
    MISSIONS.forEach((m, i) => {
      const done = this.state.completed[m.id];
      const active = i === this.state.mission && !done;
      const locked = i > this.state.mission && !done;
      const li = makeEl("li", done ? "done" : active ? "active" : locked ? "locked" : "");
      const badge = makeEl("span", "badge", done ? "✓" : locked ? "🔒" : active ? "►" : "·");
      const txt = makeEl("span");
      txt.appendChild(makeEl("span", "mname", (i+1) + ". " + m.name));
      txt.appendChild(makeEl("span", "mdesc", done ? "complete" : m.tagline));
      li.appendChild(badge); li.appendChild(txt);
      ul.appendChild(li);
    });
    // achievements
    const a = $("#achievements");
    const keys = Object.keys(this.state.achievements);
    if (keys.length === 0){ a.innerHTML = '<span class="dim" style="font-size:12px">none yet...</span>'; }
    else {
      a.innerHTML = "";
      keys.forEach(k => a.appendChild(makeEl("span", "achv", k)));
    }
  },

  /* ---- output utilities ---- */
  echo(ps1, cmd){
    const e = makeEl("div", "line echo");
    e.appendChild(makeEl("span", "ps1", ps1 + " "));
    e.appendChild(makeEl("span", "cmdtext", cmd));
    out.appendChild(e); scrollBottom();
  },
  async narrate(text, cls, speed){ await typeText(text, cls, speed); await sleep(60); },
  clear(){ out.innerHTML = ""; },

  /* ---- mission lifecycle ---- */
  startMission(index){
    if (index >= MISSIONS.length) return this.victory();
    this.state.mission = index;
    this.current = MISSIONS[index];
    $("#ps1").textContent = this.current.prompt;
    this.syncHUD();
    this.save();
    this.runBrief(this.current);
  },
  async runBrief(m){
    await sleep(250);
    await this.narrate(m.brief(), null, 10);
    if (m.hint) print("");
    print("[ mission ] " + m.name.toUpperCase() + " — type `help` to list tools, `hint` for a nudge.", "dim");
    print("");
  },
  async completeMission(){
    const m = this.current;
    if (this.state.completed[m.id]) return;
    this.state.completed[m.id] = true;
    const penalty = (m.hintsThisMission || 0) * 100;
    const gain = Math.max(200, m.points - penalty);
    this.addScore(gain);
    Audio.win();
    print("");
    print("╔══════════════════════════════════════════════╗", "ok");
    print("║            MISSION COMPLETE                  ║", "ok");
    print("╚══════════════════════════════════════════════╝", "ok");
    print("  " + m.name + " cleared.  +" + gain + " pts" + (penalty ? "  (-" + penalty + " hint penalty)" : ""), "accent");
    if (m.onComplete) m.onComplete();
    this.save(); this.syncHUD();
    if (Object.keys(this.state.completed).length === MISSIONS.length){
      await sleep(600); return this.victory();
    }
    print("");
    print("  >> press ENTER or type `next` to continue...", "dim");
    this.awaitingNext = true;
  },
  nextMission(){
    if (!this.awaitingNext) return false;
    this.awaitingNext = false;
    this.clear();
    this.startMission(this.state.mission + 1);
    return true;
  },

  async victory(){
    this.clear();
    Audio.flag();
    print("", "ok");
    print("  ██████╗  ██████╗  ██████╗ ████████╗", "ascii");
    print("  ██╔══██╗██╔═══██╗██╔═══██╗╚══██╔══╝", "ascii");
    print("  ██████╔╝██║   ██║██║   ██║   ██║   ", "ascii");
    print("  ██╔══██╗██║   ██║██║   ██║   ██║   ", "ascii");
    print("  ██║  ██║╚██████╔╝╚██████╔╝   ██║   ", "ascii");
    print("  ╚═╝  ╚═╝ ╚═════╝  ╚═════╝    ╚═╝   ", "ascii");
    print("");
    await this.narrate("You cleared the range. Five systems fell to skill and patience, not damage.", "accent", 18);
    print("");
    print("  ★ FINAL FLAG: " + FINAL_FLAG, "flag");
    print("");
    print("  FINAL SCORE: " + this.state.score + " / " + MAX_SCORE, "ok");
    this.rank();
    this.award("Range Champion");
    print("");
    print("  Take it further the legal way: TryHackMe, picoCTF, and your school's cyber club.", "dim");
    print("  Remember the rule: only ever test machines you own or have permission to test.", "dim");
    print("");
    print("  Thank you for playing the GRIZZLY_SE Training Range. Type `reset confirm` to try for a perfect run.", "dim");
    print("  Grizzly System Engineering  //  Rugged Engineering. Forensic Precision.", "dim");
    print("");
  },
  rank(){
    const pct = this.state.score / MAX_SCORE;
    let r = "SCRIPT KIDDIE";
    if (pct >= 1) r = "RANGE CHAMPION // GRIZZLY_SE";
    else if (pct >= 0.9) r = "WHITE HAT";
    else if (pct >= 0.75) r = "ANALYST";
    else if (pct >= 0.55) r = "TRAINEE";
    print("  RANK: " + r, "violet");
  },

  useHint(){
    const m = this.current;
    if (!m) return;
    if (!m.hint) { print("[-] No hint available right now.", "dim"); return; }
    m.hintsThisMission = (m.hintsThisMission || 0) + 1;
    this.state.hints++;
    print("[ HINT " + m.hintsThisMission + " ] " + m.hint(m.hintsThisMission), "warn");
    this.syncHUD(); this.save();
  }
};

const FINAL_FLAG = "FLAG{grizzlyse_r00t_4cc3ss}";
let MAX_SCORE = 0;

/* ============================================================================
   COMMANDS  (each returns string[] | null; null = printed directly)
   ========================================================================== */
function readFile(name){
  const m = Game.current;
  if (!m) return null;
  if (!(name in m.fs)) return undefined;
  return m.fs[name];
}
function fsLines(name){
  const f = readFile(name);
  if (f === undefined || f === null) return null;
  const f2 = (typeof f === "object" && f.text !== undefined) ? f.text : f;
  return String(f2).split("\n");
}
function fsList(){ return Object.keys(Game.current.fs); }

const COMMANDS = {};

/* --- general --- */
COMMANDS.help = { desc:"list available commands", run(){
  const lines = ["", "AVAILABLE COMMANDS", "───────────────────"];
  const names = Object.keys(CMDS_TABLE()).sort();
  for (const n of names){
    lines.push("  " + n.padEnd(14) + CMDS_TABLE()[n].desc);
  }
  lines.push("", "  ↑/↓ history   Tab complete   `clear` wipes the screen");
  lines.push("");

/* --- text-processing commands (pipeline aware) --- */
COMMANDS.grep = { desc:"filter lines  (grep [-o] <pattern> [file])", run(args, input){
  let outLines = input;
  let oOnly = false;
  const rest = [];
  for (const a of args){
    if (a.length > 1 && a[0] === "-" && a !== "--"){ if (a.indexOf("o") !== -1) oOnly = true; }
    else rest.push(a);
  }
  let pattern = rest[0];
  const file = rest[1];
  if (pattern === undefined) return ["usage: grep [-o] <pattern> [file]"];
  if (!outLines && file){
    const l = fsLines(file);
    if (l === null) return ["grep: " + file + ": No such file or directory"];
    outLines = l;
  }
  if (!outLines) return ["grep: no input. pipe into it or give a file."];
  let re;
  try { re = new RegExp(pattern, "g"); } catch(e){ return ["grep: invalid pattern"]; }
  const res = [];
  for (const line of outLines){
    if (oOnly){
      const m = line.match(re);
      if (m) for (const x of m) res.push(x);
    } else if (re.test(line)) { re.lastIndex = 0; res.push(line); }
    re.lastIndex = 0;
  }
  return res;
}};

COMMANDS.sort = { desc:"sort lines  (sort [-n] [-r])", run(args, input){
  if (!input) return ["sort: no input"];
  const lines = input.slice();
  let num = false, rev = false;
  for (const a of args){
    if (a.length > 1 && a[0] === "-" && a !== "--"){
      if (a.indexOf("n") !== -1) num = true;
      if (a.indexOf("r") !== -1) rev = true;
    }
  }
  lines.sort((a,b)=>{
    let x=a, y=b;
    if (num){ x = parseFloat(a)||0; y = parseFloat(b)||0; }
    if (x<y) return rev?1:-1;
    if (x>y) return rev?-1:1;
    return 0;
  });
  return lines;
}};

COMMANDS.uniq = { desc:"collapse repeats  (uniq [-c])", run(args, input){
  if (!input) return ["uniq: no input"];
  const count = args.some(a => a.length > 1 && a[0] === "-" && a.indexOf("c") !== -1);
  const res = []; let i = 0;
  while (i < input.length){
    let j = i+1;
    while (j < input.length && input[j] === input[i]) j++;
    if (count) res.push(String(j-i).padStart(4," ") + "  " + input[i]);
    else res.push(input[i]);
    i = j;
  }
  return res;
}};

COMMANDS.wc = { desc:"count lines  (wc [-l])", run(args, input){
  if (!input) return ["wc: no input"];
  return [String(input.length)];
}};

COMMANDS.head = { desc:"first N lines  (head [-n N])", run(args, input){
  if (!input) return ["head: no input"];
  const nArg = args.find(a => /^-n?$/.test(a));
  let n;
  if (nArg === "-n") n = parseInt(args[args.indexOf("-n") + 1], 10);
  else if (nArg === "-") { /* ignored */ }
  const short = args.find(a => /^-\d+$/.test(a));
  if (!Number.isFinite(n) || n <= 0) n = short ? parseInt(short.slice(1), 10) : parseInt(args[0], 10);
  if (!Number.isFinite(n) || n <= 0) n = 10;
  return input.slice(0, n);
}};

COMMANDS.tail = { desc:"last N lines  (tail [-n N])", run(args, input){
  if (!input) return ["tail: no input"];
  let n;
  if (args.includes("-n")) n = parseInt(args[args.indexOf("-n") + 1], 10);
  const short = args.find(a => /^-\d+$/.test(a));
  if (!Number.isFinite(n) || n <= 0) n = short ? parseInt(short.slice(1), 10) : parseInt(args[0], 10);
  if (!Number.isFinite(n) || n <= 0) n = 10;
  return input.slice(-n);
}};

COMMANDS.strings = { desc:"extract printable text  (strings <file>)", run(args){
  if (!args[0]) return ["usage: strings <file>"];
  const f = readFile(args[0]);
  if (f === undefined || f === null) return ["strings: " + args[0] + ": No such file or directory"];
  const txt = (typeof f === "object" ? f.text : f);
  const matches = String(txt).match(/[\x20-\x7e]{4,}/g) || [];
  if (!matches.length) return ["(no printable strings found)"];
  return matches;
}};

COMMANDS.base64 = { desc:"base64  (base64 -d <text>)", run(args){
  const d = args.includes("-d");
  const text = args.filter(a => a !== "-d").join(" ");
  if (!text) return ["usage: base64 -d <text>"];
  if (d){
    try{
      const dec = atob(text.trim());
      if (dec.indexOf("FLAG{") !== -1) missingFlagDecoded();
      return dec.split("\n");
    }catch(e){ return ["base64: invalid input"]; }
  }
  try{ return [btoa(text)]; }catch(e){ return ["base64: invalid input"]; }
}};

/* ============================================================================
   INPUT HANDLING
   ========================================================================== */
let busy = false;
const cmdInput = $("#cmd");

async function handleInput(raw){
  raw = raw.trim();
  if (raw === ""){
    if (Game.awaitingNext){ Game.nextMission(); }
    return;
  }
  const ps1 = $("#ps1").textContent;
  Game.echo(ps1, raw);
  Game.history.push(raw);
  Game.histIdx = Game.history.length;
  Game.state.commands++;
  Game.syncHUD(); Game.save();

  if (Game.awaitingNext && raw !== "next"){
    print("(mission complete - press ENTER or type `next` to continue. This command still runs.)", "dim");
  }

  const stages = raw.split("|").map(s => s.trim()).filter(Boolean);
  const table = CMDS_TABLE();

  // pipeline (text commands only)
  if (stages.length > 1){
    let data = null;
    for (let i=0;i<stages.length;i++){
      const [name, ...args] = tokenize(stages[i]);
      const h = table[name];
      if (!h){ print("grizzlyse: " + name + ": command not found", "err"); Audio.err(); return; }
      const res = await h.run(args, data);
      if (res === null && i < stages.length-1){ print("grizzlyse: " + name + " cannot be piped", "err"); return; }
      data = res;
    }
    if (data) printLines(data);
    return;
  }

  const [name, ...args] = tokenize(raw);
  const h = table[name];
  if (!h){ print("grizzlyse: " + name + ": command not found. Try `help`.", "err"); Audio.err(); return; }

  busy = true; cmdInput.disabled = true;
  try{
    const res = await h.run(args, null);
    if (Array.isArray(res)) printLines(res);
  }catch(e){
    print("grizzlyse: internal error: " + e.message, "err");
  }finally{
    busy = false; cmdInput.disabled = false; cmdInput.focus();
  }
}

/* -------- input events -------- */
cmdInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter"){
    const v = cmdInput.value;
    cmdInput.value = "";
    skipTyping = true;
    handleInput(v);
  } else if (e.key === "ArrowUp"){
    e.preventDefault();
    if (Game.history.length){
      Game.histIdx = Math.max(0, Game.histIdx - 1);
      cmdInput.value = Game.history[Game.histIdx] || "";
      setTimeout(()=>cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length),0);
    }
  } else if (e.key === "ArrowDown"){
    e.preventDefault();
    Game.histIdx = Math.min(Game.history.length, Game.histIdx + 1);
    cmdInput.value = Game.history[Game.histIdx] || "";
  } else if (e.key === "Tab"){
    e.preventDefault();
    autocomplete();
  } else {
    Audio.key();
  }
});

function autocomplete(){
  const val = cmdInput.value;
  const parts = val.split(/\s+/).filter(Boolean);
  if (parts.length > 1 && !val.endsWith(" ")){
    const last = parts.pop();
    const files = Game.current ? fsList() : [];
    const matches = files.filter(f => f.startsWith(last));
    if (matches.length === 1){ parts.push(matches[0]); cmdInput.value = parts.join(" ") + " "; }
    else if (matches.length > 1) print("  " + matches.join("   "), "dim");
    return;
  }
  const table = CMDS_TABLE();
  const matches = Object.keys(table).filter(c => c.startsWith(val));
  if (matches.length === 1) cmdInput.value = matches[0] + " ";
  else if (matches.length > 1) print("  " + matches.join("   "), "dim");
}

/* click anywhere focuses input */
document.addEventListener("click", (e) => {
  if (e.target.closest("#sidebar") || e.target.tagName === "BUTTON") return;
  if (!busy) cmdInput.focus();
});
/* any keypress or click skips the typewriter so fast readers are never stuck */
document.addEventListener("keydown", () => { skipTyping = true; });
document.addEventListener("click", () => { skipTyping = true; });
document.addEventListener("keydown", (e) => {
  if (document.activeElement !== cmdInput && !busy && e.key.length === 1){ cmdInput.focus(); }
});
